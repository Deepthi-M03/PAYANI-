[project]
name = "payani"
version = "1.0.0"
description = "PAYANI backend — railway group-booking, journey planning and travel intelligence (Phase 2 foundation)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "numpy>=2.1",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "networkx>=3.3",
]

[project.optional-dependencies]
push = ["pywebpush>=2.0"]  # only needed when VAPID keys are configured

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["payani"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: correctness, I: imports, B: bugbear, S: bandit security rules, UP: modern syntax
select = ["E", "F", "I", "B", "S", "UP"]
ignore = [
  "B008",  # FastAPI's Depends() in argument defaults is idiomatic
  "E501",  # line length is handled by `ruff format`
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "S608"]  # asserts, test passwords, seeded RNG, test-only SQL
"payani/models.py" = ["F401"]  # re-exports every model so Base.metadata is complete
"alembic/versions/**" = ["S608"]  # seed SQL built from hard-coded literals only

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: trains the synthetic forecasting model (a few seconds)"]

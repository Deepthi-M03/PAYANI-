# Render Blueprint for the PAYANI API + PostgreSQL (free instance types only).
# Secrets are generated by Render (generateValue) and never stored in the repository.
# Free-tier limits (checked 26 Nov 2026): the web service sleeps after 15 minutes idle,
# and the free database expires 30 days after creation. See docs/deployment.md.
databases:
  - name: payani-db
    plan: free
    databaseName: payani
    user: payani

services:
  - type: web
    name: payani-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install .
    # Migrations and the synthetic timetable load are idempotent and run on every start.
    startCommand: >-
      alembic upgrade head &&
      python -m payani.seeds.load --profile catalogue &&
      uvicorn payani.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: payani-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WORKER_TICK_TOKEN
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: RUN_WORKER_IN_API
        value: "true"
      - key: CORS_ORIGINS
        sync: false  # set to ["https://<your-site>.netlify.app"] after the frontend exists
      - key: LOG_LEVEL
        value: INFO
      - key: BOOTSTRAP_SUPER_ADMIN_EMAIL
        sync: false  # your email; register it on the site, then redeploy once

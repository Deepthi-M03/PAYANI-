# Render Blueprint for the PAYANI API (free instance type only).
# The database is NOT created here: Render's free Postgres expires after 30 days, so the
# database is a free Neon project and its connection string is pasted into DATABASE_URL.
# Secrets are generated by Render (generateValue) and never stored in the repository.
# The web service sleeps after 15 minutes idle; the frontend waits for it to wake.
# See docs/deployment.md.
services:
  - type: web
    name: payani-api
    runtime: python
    plan: free
    rootDir: backend
    # requirements.txt is generated from uv.lock, so the versions deployed are the versions tested.
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # Migrations and the synthetic timetable load are idempotent and run on every start.
    startCommand: >-
      alembic upgrade head &&
      python -m payani.seeds.load --profile catalogue &&
      uvicorn payani.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false  # Neon DIRECT (non-pooled) connection string, ending in ?sslmode=require
      - key: WARM_FORECAST_ON_START
        value: "true"  # train the forecast model in the background right after each wake-up
      - key: JWT_SECRET
        generateValue: true
      - key: WORKER_TICK_TOKEN
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: RUN_WORKER_IN_API
        value: "true"
      - key: CORS_ORIGINS
        sync: false  # set to ["https://<your-site>.netlify.app"] after the frontend exists
      - key: LOG_LEVEL
        value: INFO
      - key: BOOTSTRAP_SUPER_ADMIN_EMAIL
        sync: false  # your email; register it on the site, then redeploy once
